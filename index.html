<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bat Signal Chat</title>
  <link rel="stylesheet" href="src/styles.css" />
  <script defer src="/socket.io/socket.io.js" defer></script>
  <script defer src="client.js" defer></script>
</head>

<body>
  <main class="chat">
    <header class="chat__header">
      <img src="Batman-Logo-Evolution-1-1155x770.png" alt="Batman logo" />
      <div>
        <h1>Bat Signal Chat</h1>
        <p id="status">Connecting...</p>
      </div>
    </header>

    <section class="setup" aria-label="Your name">
      <label for="nameInput">Your name</label>
      <input id="nameInput" type="text" value="Guest" autocomplete="name" />
      <button id="joinButton" type="button">Join</button>
    </section>
    <div class="message-container">
      <section id="messages" class="messages" aria-live="polite">
        <p class="message message--system">Open this page in two tabs, join, then send a message.</p>
      </section>
   </div> 
      <form id="messageForm" class="composer">
     
        <input id="messageInput" type="text" placeholder="Type a message..." autocomplete="off" />

        <button type="submit">Send</button>
   
    </form>

  </main>
</body>

</html>
